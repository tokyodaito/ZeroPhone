name: desktop-distributables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Release packaging only: unit tests already ran in the required CI check,
# so this workflow never gates the PR series.
concurrency:
  group: desktop-distributables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: zerophone-desktop-${{ matrix.format }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            format: dmg
          - os: windows-latest
            format: msi
          - os: ubuntu-latest
            format: deb
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Install WiX 3.14 (jpackage msi requirement)
        if: matrix.format == 'msi'
        shell: cmd
        run: |
          curl -sL -o wix314.exe https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314.exe
          .\wix314.exe /install /q
          echo "C:\Program Files (x86)\WiX Toolset 3.14\bin" >> %GITHUB_PATH%

      - name: Package native distribution
        shell: bash
        run: ./gradlew :desktop:packageDistributionForCurrentOS --stacktrace

      - name: Zip JVM distributable
        if: matrix.format == 'deb'
        run: |
          cd desktop/build/compose/binaries/main
          zip -qr "$RUNNER_TEMP/zerophone-desktop-zip-${GITHUB_RUN_NUMBER}.zip" app

      - name: Upload dmg artifact
        if: matrix.format == 'dmg'
        uses: actions/upload-artifact@v4
        with:
          name: zerophone-desktop-dmg-${{ github.run_number }}
          path: desktop/build/compose/binaries/main/dmg/*.dmg
          retention-days: 90
          if-no-files-found: error

      - name: Upload msi artifact
        if: matrix.format == 'msi'
        uses: actions/upload-artifact@v4
        with:
          name: zerophone-desktop-msi-${{ github.run_number }}
          path: desktop/build/compose/binaries/main/msi/*.msi
          retention-days: 90
          if-no-files-found: error

      - name: Upload deb artifact
        if: matrix.format == 'deb'
        uses: actions/upload-artifact@v4
        with:
          name: zerophone-desktop-deb-${{ github.run_number }}
          path: desktop/build/compose/binaries/main/deb/*.deb
          retention-days: 90
          if-no-files-found: error

      - name: Upload zip artifact
        if: matrix.format == 'deb'
        uses: actions/upload-artifact@v4
        with:
          name: zerophone-desktop-zip-${{ github.run_number }}
          path: ${{ runner.temp }}/zerophone-desktop-zip-${{ github.run_number }}.zip
          retention-days: 90
          if-no-files-found: error

name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: assembleDebug + testDebugUnitTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :core:model:test :core:context:test --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  sync-server:
    name: sync-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit-test :sync:server
        run: ./gradlew :sync:server:build --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-server-test-reports
          path: 'sync/server/build/reports/tests/**'
          if-no-files-found: ignore

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit-test :desktop
        run: ./gradlew :desktop:build :desktop:test --stacktrace

      - name: Package :desktop distributions (deb + app image)
        run: ./gradlew :desktop:packageDistributionForCurrentOS --stacktrace

      - name: Zip JVM distributable
        run: |
          cd desktop/build/compose/binaries/main
          zip -qr "$RUNNER_TEMP/zerophone-desktop-jvm-${GITHUB_RUN_NUMBER}.zip" app

      - name: Upload JVM zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerophone-desktop-jvm-${{ github.run_number }}
          path: ${{ runner.temp }}/zerophone-desktop-jvm-${{ github.run_number }}.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: zerophone-desktop-deb-${{ github.run_number }}
          path: desktop/build/compose/binaries/main/deb/*.deb
          retention-days: 14
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-reports
          path: 'desktop/build/reports/tests/**'
          if-no-files-found: ignore

name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: assembleDebug + tests + lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :core:model:test :core:context:test --stacktrace

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload test and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            '**/build/reports/tests/**'
            'app/build/reports/lint-results-debug.html'
          if-no-files-found: ignore

  sync-server:
    name: sync-server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit-test :sync:server
        run: ./gradlew :sync:server:build --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sync-server-test-reports
          path: 'sync/server/build/reports/tests/**'
          if-no-files-found: ignore

name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: assembleDebug + testDebugUnitTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with wrapper validation)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest :core:model:test :core:context:test --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
